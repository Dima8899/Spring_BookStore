databaseChangeLog:
  - changeSet:
      id: 09-create-categories-table
      author: DimaB
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: is_deleted
                  type: tinyint(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false