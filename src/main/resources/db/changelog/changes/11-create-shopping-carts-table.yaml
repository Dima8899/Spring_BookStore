databaseChangeLog:
  - changeSet:
      id: 011
      author: DimaB
      changes:
        - createTable:
            tableName: shopping_carts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_shopping_carts_user
                    references: users(id)
              - column:
                  name: is_deleted
                  type: tinyint(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
