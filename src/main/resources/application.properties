spring.application.name=library
spring.datasource.url=jdbc:mysql://${MYSQLDB_HOST:localhost}:${MYSQLDB_DOCKER_PORT:3306}\
  /${MYSQLDB_DATABASE:online_book_store}?serverTimezone=UTC
spring.datasource.username=${MYSQLDB_USER:root}
spring.datasource.password=${MYSQLDB_ROOT_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.open-in-view=false

jwt.expiration=${JWT_EXPIRATION:300000}
jwt.secret=${JWT_SECRET:helloworld7he9dhjdhwhwdqh1h219hgubuiqbuwqy8819yh8d}
